<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0e12; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; overflow: hidden; }
  .banner {
    width: 1500px;
    height: 500px;
    background:
      radial-gradient(ellipse at 80% 30%, rgba(255, 107, 53, 0.10), transparent 55%),
      radial-gradient(ellipse at 20% 70%, rgba(76, 149, 255, 0.09), transparent 50%),
      #0d0e12;
    color: #e8eaed;
    position: relative;
    padding: 60px 80px;
    overflow: hidden;
  }
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size: 56px 56px;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: 280px;
  }

  .name {
    font-size: 104px;
    font-weight: 800;
    color: #e8eaed;
    letter-spacing: -4px;
    line-height: 0.95;
    margin-bottom: 22px;
  }
  .name .dot { color: #ff6b35; }

  .tagline {
    font-size: 22px;
    color: #c4c7d0;
    line-height: 1.4;
    margin-bottom: 28px;
    letter-spacing: 0.1px;
  }
  .tagline .sep { color: #4a4d56; margin: 0 14px; }

  .chips {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    max-width: 1000px;
  }
  .chip {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 16px;
    border: 1px solid #2a2d36;
    color: #a4a7b0;
    background: rgba(21, 23, 28, 0.6);
    letter-spacing: 0.3px;
    font-weight: 500;
  }
  .chip.accent { border-color: #4c95ff; color: #4c95ff; }

  /* corner: currently shipping */
  .corner {
    position: absolute;
    top: 56px;
    right: 80px;
    text-align: right;
    z-index: 2;
  }
  .corner-label {
    font-size: 11px;
    color: #6a6d76;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .corner-project {
    font-size: 36px;
    font-weight: 800;
    color: #4c95ff;
    letter-spacing: -1px;
    line-height: 1;
  }
  .corner-stat {
    font-size: 13px;
    color: #8a8d96;
    margin-top: 10px;
  }
  .corner-stat b { color: #ff6b35; font-weight: 700; }

  /* bottom-right url */
  .url {
    position: absolute;
    bottom: 28px;
    right: 80px;
    font-size: 13px;
    color: #6a6d76;
    letter-spacing: 0.5px;
    z-index: 2;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="corner">
    <div class="corner-label">CURRENTLY SHIPPING</div>
    <div class="corner-project">solhunt</div>
    <div class="corner-stat"><b>67.7%</b> exploit rate on real DeFi hacks</div>
  </div>

  <div class="content">
    <div class="name">clay<span class="dot">.</span></div>
    <div class="tagline">
      autonomous AI agents
      <span class="sep">·</span>
      smart contract security
      <span class="sep">·</span>
      DeFi infrastructure
    </div>
    <div class="chips">
      <span class="chip">TypeScript</span>
      <span class="chip">Python</span>
      <span class="chip">Solidity</span>
      <span class="chip">Node.js</span>
      <span class="chip">Docker</span>
      <span class="chip">Foundry</span>
      <span class="chip">PostgreSQL</span>
      <span class="chip accent">Anthropic API</span>
    </div>
  </div>

  <div class="url">claygeo.dev</div>
</div>
</body>
</html>
